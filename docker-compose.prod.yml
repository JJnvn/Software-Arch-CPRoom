# Production Docker Compose for CPRoom Booking System
# Complete deployment with frontend and backend services
version: '3.8'

services:
  # Database Services
  postgres:
    image: postgres:15
    container_name: cproom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password123}
      POSTGRES_DB: ${DB_NAME:-cproom_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cproom_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-cproom_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    container_name: cproom-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-admin123}
    volumes:
      - mongo_data:/data/db
    networks:
      - cproom_net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: cproom-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    networks:
      - cproom_net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 10s
      retries: 6

  # Backend Microservices
  auth-service:
    build:
      context: ./backend
      dockerfile: ./services/auth/Dockerfile
    container_name: cproom-auth-service
    restart: unless-stopped
    environment:
      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-password123}
      DB_NAME: ${DB_NAME:-cproom_db}
      
      # JWT
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      JWT_EXPIRY: ${JWT_EXPIRY:-24h}
      
      # OAuth
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_REDIRECT_URL: ${GITHUB_REDIRECT_URL:-http://localhost:8000/auth/github/callback}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      
      # Service
      AUTH_SERVICE_PORT: 8081
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cproom_net

  room-service:
    build:
      context: ./backend
      dockerfile: ./services/room/Dockerfile
    container_name: cproom-room-service
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-password123}
      DB_NAME: ${DB_NAME:-cproom_db}
      ROOM_SERVICE_PORT: 8082
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cproom_net

  booking-service:
    build:
      context: ./backend
      dockerfile: ./services/booking/Dockerfile
    container_name: cproom-booking-service
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-password123}
      DB_NAME: ${DB_NAME:-cproom_db}
      
      # RabbitMQ
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
      RABBITMQ_QUEUE_NAME: ${RABBITMQ_QUEUE_NAME:-notification_queue}
      RABBITMQ_EVENTS_QUEUE_NAME: ${RABBITMQ_EVENTS_QUEUE_NAME:-notification_events}
      
      # Service Ports
      BOOKING_HTTP_PORT: 8083
      BOOKING_SERVICE_PORT: 50051
      
      # Service URLs
      ROOM_SERVICE_URL: ${ROOM_SERVICE_URL:-http://room-service:8082}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth-service:8081}
      APPROVAL_SERVICE_URL: ${APPROVAL_SERVICE_URL:-http://approval-service:8085}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - cproom_net

  approval-service:
    build:
      context: ./backend
      dockerfile: ./services/approval/Dockerfile
    container_name: cproom-approval-service
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-password123}
      DB_NAME: ${DB_NAME:-cproom_db}
      
      # RabbitMQ
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
      RABBITMQ_QUEUE_NAME: ${RABBITMQ_QUEUE_NAME:-notification_queue}
      
      # Service
      APPROVAL_SERVICE_PORT: 8085
      APPROVAL_GRPC_PORT: 50053
      
      # Service URLs
      BOOKING_SERVICE_URL: ${BOOKING_SERVICE_URL:-http://booking-service:8083}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - cproom_net

  notification-service:
    build:
      context: ./backend
      dockerfile: ./services/notification/Dockerfile
    container_name: cproom-notification-service
    restart: unless-stopped
    environment:
      # MongoDB
      MONGO_URI: ${MONGO_URI:-mongodb://admin:admin123@mongo:27017}
      MONGO_DB_NAME: ${MONGO_DB_NAME:-cproom_notifications}
      
      # RabbitMQ
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
      RABBITMQ_QUEUE_NAME: ${RABBITMQ_QUEUE_NAME:-notification_queue}
      RABBITMQ_EVENTS_QUEUE_NAME: ${RABBITMQ_EVENTS_QUEUE_NAME:-notification_events}
      
      # SMTP (configure with your email provider)
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM:-noreply@cproom.com}
      
      # Service
      NOTIFICATION_SERVICE_PORT: 8084
      NOTIFICATION_DEFAULT_EMAIL: ${NOTIFICATION_DEFAULT_EMAIL:-admin@cproom.com}
      NOTIFICATION_CHANNEL: ${NOTIFICATION_CHANNEL:-email}
      
      # JWT Secret (for validating tokens)
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      
      # Service URLs
      AUTH_SERVICE_INTERNAL_URL: ${AUTH_SERVICE_INTERNAL_URL:-http://auth-service:8081}
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - cproom_net

  # API Gateway (Kong)
  api-gateway:
    image: kong:3.6
    container_name: cproom-api-gateway
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_LOG_LEVEL: ${KONG_LOG_LEVEL:-info}
    ports:
      - "${API_GATEWAY_PORT:-8000}:8000"  # Only expose API Gateway HTTP port
    volumes:
      - ./backend/kong/kong.yml:/etc/kong/kong.yml:ro
      - ./backend/kong/certs:/etc/kong/certs:ro
    depends_on:
      - auth-service
      - room-service
      - booking-service
      - approval-service
      - notification-service
    networks:
      - cproom_net
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8000}
    container_name: cproom-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"  # Only expose frontend HTTP port
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - cproom_net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  postgres_data:
    driver: local
  mongo_data:
    driver: local

networks:
  cproom_net:
    driver: bridge
